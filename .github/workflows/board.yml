name: Board

# Keeps the project board's Status column in step with issues, PRs and blockers (T40,
# scripts/board-sync.mjs). pull_request_target runs this file from main, with main's code, for PRs
# from forks too: it never checks out or runs a PR's code, and no event value reaches a shell.
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request_target:
    types:
      [opened, closed, reopened, ready_for_review, converted_to_draft, edited]
  schedule:
    - cron: "*/15 * * * *" # blockers change without an event
  workflow_dispatch:

concurrency:
  group: board-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PROJECT_TOKEN is a secret of this environment, and only main may use the environment. It
    # belongs to a machine account that can reach this board only (CONTRIBUTING).
    environment: board
    # This job holds a write token for the board, so even GitHub's own actions are pinned to a
    # commit, and setup-node restores no package cache into this job.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/board-sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
